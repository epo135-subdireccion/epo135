<script>
const TOPICS = [

    "Fotosíntesis, transpiración e intercambio gaseoso",

    "Hormonas vegetales",
    "Crecimiento primario y secundario",
    "Reproducción sexual en plantas",
    "Alternancia de generaciones",
    "Reproducción en helechos y musgos"
  ]},
  { group: "III. Anatomía y Fisiología Animal (25%)", color: "coral", icon: "ti-heart-rate-monitor", subtopics: [
    "Sistema digestivo y nutrición",
    "Sistema respiratorio",
    "Sistema circulatorio y sangre",
    "Sistema linfático",
    "Sistema locomotor: huesos y músculos",
    "Sistema excretor y renal",
    "Sistema nervioso: central y periférico",
    "Sistema endocrino y hormonas",
    "Reproducción y desarrollo embrionario",
    "Sistema inmune: anticuerpos y linfocitos"
  ]},
  { group: "IV. Etología (5%)", color: "amber", icon: "ti-paw", subtopics: [
    "Comportamiento innato y adquirido",
    "Patrones de acción fija",
    "Comunicación y biorritmo",
    "Ecología del comportamiento"
  ]},
  { group: "V. Bioestadística (10%)", color: "purple", icon: "ti-chart-histogram", subtopics: [
    "Probabilidad y distribuciones",
    "Media, mediana, varianza, desviación estándar",
    "Test T y Chi cuadrado"
  ]},
  { group: "VI. Genética y Evolución (5%)", color: "blue", icon: "ti-git-branch", subtopics: [
    "Herencia mendeliana: cruza mono y dihíbrida",
    "Alelos múltiples y ligamiento al sexo",
    "Principio de Hardy-Weinberg",
    "Mecanismos de evolución",
    "Especiación y genética de poblaciones"
  ]},
  { group: "VII. Ecología (10%)", color: "teal", icon: "ti-plant", subtopics: [
    "Estructura y dinámica de poblaciones",
    "Dinámica de comunidades",
    "Relaciones interespecíficas",
    "Ecosistemas: flujo de energía",
    "Cadenas y redes alimenticias",
    "Ciclos biogeoquímicos",
    "Biomas y conservación"
  ]},
  { group: "VIII. Biosistemática (5%)", color: "gray", icon: "ti-sitemap", subtopics: [
    "Taxonomía y sistemática",
    "Dominios: Bacteria, Archaea, Eukarya",
    "Reino Fungi: características",
    "Reino Plantae: grupos principales",
    "Reino Animalia: Phyla principales",
    "Organismos específicos: Archaea y Bacteria"
  ]}
];

let selectedTopic = "";
let selectedGroup = "";

function buildTree() {
  const tree = document.getElementById('topic-tree');
  TOPICS.forEach((g, gi) => {
    const group = document.createElement('div');
    group.className = 'topic-group';

    const title = document.createElement('div');
    title.className = 'topic-group-title';
    title.innerHTML = `<i class="ti ${g.icon}" aria-hidden="true" style="font-size:14px"></i> <span style="flex:1">${g.group.split('(')[0].trim()}</span> <span class="arrow">▶</span>`;

    const pct = g.group.match(/\d+%/)?.[0] || '';
    if (pct) {
      const badge = document.createElement('span');
      badge.style.cssText = 'font-size:10px;padding:1px 6px;border-radius:99px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);';
      badge.textContent = pct;
      title.insertBefore(badge, title.lastChild);
    }

    const list = document.createElement('div');
    list.className = 'topic-list';
    list.style.display = 'none';

    g.subtopics.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'topic-chip';
      chip.textContent = t;
      chip.onclick = () => selectTopic(t, g.group, g.color, chip);
      list.appendChild(chip);
    });

    title.onclick = () => {
      const open = list.style.display !== 'none';
      list.style.display = open ? 'none' : 'block';
      title.classList.toggle('open', !open);
    };

    group.appendChild(title);
    group.appendChild(list);
    tree.appendChild(group);
  });
}

function selectTopic(topic, group, color, chipEl) {
  document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('selected'));
  chipEl.classList.add('selected');
  selectedTopic = topic;
  selectedGroup = group;
  document.getElementById('topic-display').textContent = topic;
  document.getElementById('btn-generate').disabled = false;
}

async function generarInfografia() {
  if (!selectedTopic) return;

  const style = document.getElementById('sel-style').value;
  const placeholder = document.getElementById('placeholder');
  const loading = document.getElementById('loading');
  const output = document.getElementById('infografia-output');
  const actionBar = document.getElementById('action-bar');
  const btn = document.getElementById('btn-generate');

  placeholder.style.display = 'none';
  output.style.display = 'none';
  actionBar.style.display = 'none';
  loading.style.display = 'flex';
  btn.disabled = true;

  const msgs = [
    'Analizando contenido del tema...',
    'Estructurando la infografía...',
    'Generando conceptos clave...',
    'Añadiendo datos importantes...'
  ];
  let mi = 0;
  const interval = setInterval(() => {
    document.getElementById('loading-msg').textContent = msgs[mi++ % msgs.length];
  }, 1800);

  const styleInstructions = {
    completa: "Genera una infografía educativa COMPLETA con: 1) encabezado con título y descripción breve, 2) al menos 5 tarjetas temáticas con subtítulo, lista de puntos clave y ejemplos, 3) un diagrama de flujo o proceso si aplica, 4) datos clave o fórmulas destacadas, 5) al menos 2 preguntas tipo olimpiada de biología.",
    resumen: "Genera un RESUMEN RÁPIDO con: 1) definición concisa, 2) exactamente 3 tarjetas con los conceptos más importantes, 3) un dato clave memorable, 4) una pregunta de práctica.",
    mapa: "Genera un MAPA CONCEPTUAL visual con: 1) concepto central claramente definido, 2) al menos 6 tarjetas de conceptos relacionados organizados por categorías, 3) relaciones entre conceptos explicadas, 4) ejemplos concretos.",
    proceso: "Genera una infografía de PROCESO/FLUJO con: 1) título del proceso, 2) etapas numeradas del proceso en orden lógico (mínimo 4 etapas), 3) qué ocurre en cada etapa, 4) moléculas o estructuras involucradas, 5) dato clave sobre el proceso.",
    comparativa: "Genera una TABLA COMPARATIVA con: 1) título, 2) mínimo 2 tarjetas lado a lado comparando los elementos principales (características, ejemplos, funciones), 3) resumen de diferencias clave, 4) pregunta de práctica.",
    olimpiada: "Genera contenido ENFOCADO EN OLIMPIADA con: 1) conceptos que más se preguntan en competencia, 2) trampas comunes y errores frecuentes, 3) datos numéricos exactos que hay que memorizar, 4) 3 preguntas de práctica tipo olimpiada con pistas de solución."
  };

  const systemPrompt = `Eres un experto en biología universitaria y en olimpiadas científicas. Tu tarea es generar contenido estructurado para una infografía educativa en formato JSON. El contexto es la Guía de Estudio de la Olimpiada de Biología de la Facultad de Ciencias de la UAEMex.

IMPORTANTE: Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown. El JSON debe tener exactamente esta estructura:
{
  "titulo": "título del tema",
  "descripcion": "descripción breve de 1-2 oraciones",
  "nivel": "Básico | Intermedio | Avanzado",
  "porcentaje_examen": "porcentaje aproximado del tema en el examen",
  "tarjetas": [
    {
      "titulo": "título de la sección",
      "icono": "nombre de icono Tabler (solo el nombre sin ti-, ejemplos: dna, atom, cell, flask, microscope, plant, heart, brain, chart-bar, list)",
      "color": "teal | blue | coral | green | amber | purple | gray | pink",
      "puntos": ["punto 1", "punto 2", "punto 3"]
    }
  ],
  "flujo": {
    "titulo": "título del flujo o proceso",
    "etapas": [
      {"nombre": "Etapa 1", "descripcion": "descripción breve", "color": "teal"}
    ]
  },
  "dato_clave": "un dato memorable, fórmula o regla mnemotécnica importante",
  "preguntas_olimpiada": [
    "Pregunta de práctica tipo olimpiada 1",
    "Pregunta de práctica tipo olimpiada 2"
  ]
}`;

  const userPrompt = `${styleInstructions[style]}\n\nTema: "${selectedTopic}"\nContexto: Este tema pertenece a la sección "${selectedGroup}" de la Guía de la Olimpiada de Biología de la UAEMex.\n\nGenera el JSON de la infografía para este tema.`;

  try {
    // =======================================================================
    // AQUÍ DEBES PEGAR LA URL DE TU SCRIPT DE GOOGLE (Termina en /exec)
    // =======================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzou7MZXaS5mWK9h4fXQpR-oNXZwR0sn-udOGSLJBB1LVt7ZHnUcO7CtUkbSA8r8K4k/exec";

    // Llamamos a Google Apps Script en lugar de a Anthropic directamente
    const resp = await fetch(GAS_URL, {
      method: "POST",
      headers: { 
        "Content-Type": "text/plain;charset=utf-8" // Esto evita el error de bloqueo del navegador
      },
      body: JSON.stringify({
        model: "claude-3-haiku-20240307", // Modelo corregido
        max_tokens: 1500,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });
    
    const data = await resp.json();
    clearInterval(interval);

    // Si Google Apps Script capturó un error de la API
    if (data.error) {
   // Si el error es un objeto, lo convertimos a texto para poder leerlo
   let detalleError = typeof data.error === 'object' ? JSON.stringify(data.error) : data.error;
   throw new Error("Respuesta de Claude: " + detalleError);
}

    // Extraemos la respuesta (limpiando posibles etiquetas markdown que devuelva Claude)
    let raw = data.content?.map(b => b.text || "").join("") || "";
    if(!raw && data.respuesta) raw = data.respuesta; // Por si modificaste el backend
    
    raw = raw.replace(/```json|```/gi, "").trim();

    let info;
    try { 
      info = JSON.parse(raw); 
    } catch(e) {
      console.error("Error al convertir a JSON:", raw);
      loading.style.display = 'none';
      output.style.display = 'block';
      output.innerHTML = `<div style="padding:1rem;color:var(--color-text-danger);font-size:13px;"><i class="ti ti-alert-circle"></i> La IA no devolvió el formato correcto. Intenta generar de nuevo.</div>`;
      btn.disabled = false;
      return;
    }

    renderInfografia(info);
    loading.style.display = 'none';
    output.style.display = 'block';
    actionBar.style.display = 'flex';
    btn.disabled = false;

  } catch(e) {
    clearInterval(interval);
    console.error(e);
    loading.style.display = 'none';
    output.style.display = 'block';
    output.innerHTML = `<div style="padding:1rem;color:var(--color-text-danger);font-size:13px;"><i class="ti ti-alert-circle"></i> Error de conexión con el servidor. Verifica que tu URL de Google Apps Script sea correcta.</div>`;
    btn.disabled = false;
  }
}
const COLOR_MAP = {
  teal: { bg: '#E1F5EE', border: '#9FE1CB', text: '#085041', iconBg: '#9FE1CB' },
  blue: { bg: '#E6F1FB', border: '#B5D4F4', text: '#042C53', iconBg: '#B5D4F4' },
  coral: { bg: '#FAECE7', border: '#F5C4B3', text: '#4A1B0C', iconBg: '#F5C4B3' },
  green: { bg: '#EAF3DE', border: '#C0DD97', text: '#173404', iconBg: '#C0DD97' },
  amber: { bg: '#FAEEDA', border: '#FAC775', text: '#412402', iconBg: '#FAC775' },
  purple: { bg: '#EEEDFE', border: '#CECBF6', text: '#26215C', iconBg: '#CECBF6' },
  gray: { bg: '#F1EFE8', border: '#D3D1C7', text: '#2C2C2A', iconBg: '#D3D1C7' },
  pink: { bg: '#FBEAF0', border: '#F4C0D1', text: '#4B1528', iconBg: '#F4C0D1' }
};

function c(color) { return COLOR_MAP[color] || COLOR_MAP.teal; }

function renderInfografia(info) {
  const out = document.getElementById('infografia-output');

  let badgeColor = 'teal';
  if (info.nivel === 'Avanzado') badgeColor = 'coral';
  else if (info.nivel === 'Intermedio') badgeColor = 'amber';
  const bc = c(badgeColor);

  let html = `
  <div class="info-header">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
        <span class="info-badge" style="background:${bc.bg};border:0.5px solid ${bc.border};color:${bc.text}">${info.nivel || 'Estudio'}</span>
        ${info.porcentaje_examen ? `<span class="info-badge" style="background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);color:var(--color-text-warning)">~${info.porcentaje_examen} del examen</span>` : ''}
      </div>
      <div class="info-title">${info.titulo || selectedTopic}</div>
      <div class="info-subtitle">${info.descripcion || ''}</div>
    </div>
  </div>`;

  if (info.tarjetas && info.tarjetas.length > 0) {
    html += `<div class="info-grid">`;
    info.tarjetas.forEach(card => {
      const clr = c(card.color || 'teal');
      const puntos = (card.puntos || []).map(p => `<li>${p}</li>`).join('');
      html += `
      <div class="info-card">
        <div class="info-card-header">
          <div class="info-card-icon" style="background:${clr.iconBg}">
            <i class="ti ti-${card.icono || 'circle'}" style="font-size:14px;color:${clr.text}" aria-hidden="true"></i>
          </div>
          <span class="info-card-title">${card.titulo}</span>
        </div>
        <div class="info-card-body"><ul>${puntos}</ul></div>
      </div>`;
    });
    html += `</div>`;
  }

  if (info.flujo && info.flujo.etapas && info.flujo.etapas.length > 0) {
    html += `<div class="info-diagram">
      <div class="info-diagram-title"><i class="ti ti-arrow-right" aria-hidden="true"></i> ${info.flujo.titulo || 'Proceso'}</div>
      <div class="flow-row">`;
    info.flujo.etapas.forEach((e, i) => {
      const clr = c(e.color || 'gray');
      html += `<div class="flow-box" style="background:${clr.bg};border:0.5px solid ${clr.border};color:${clr.text}">
        <div style="font-size:10px;font-weight:500;margin-bottom:2px;">${i+1}. ${e.nombre}</div>
        <div style="font-size:10px;opacity:0.85;">${e.descripcion || ''}</div>
      </div>`;
      if (i < info.flujo.etapas.length - 1) html += `<span class="flow-arrow">→</span>`;
    });
    html += `</div></div>`;
  }

  if (info.dato_clave) {
    html += `<div class="dato-clave">
      <div class="dato-clave-label"><i class="ti ti-bulb" aria-hidden="true"></i> Dato clave para la olimpiada</div>
      <div class="dato-clave-text">${info.dato_clave}</div>
    </div>`;
  }

  if (info.preguntas_olimpiada && info.preguntas_olimpiada.length > 0) {
    info.preguntas_olimpiada.forEach((q, i) => {
      html += `<div class="pregunta-olimpiada">
        <div class="pregunta-olimpiada-label"><i class="ti ti-help" aria-hidden="true"></i> Pregunta ${i+1}</div>
        <div class="pregunta-olimpiada-text">${q}</div>
      </div>`;
    });
  }

  out.innerHTML = html;
}

function copiarTexto() {
  const out = document.getElementById('infografia-output');
  const text = out.innerText;
  navigator.clipboard.writeText(text).catch(() => {});
}

buildTree();
</script>
