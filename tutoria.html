<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librerías para generar el Word -->
    <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  </head>
  <body class="p-4">
    <div class="container">
      <h3>Selecciona un tema de investigación</h3>
      <div class="d-grid gap-2 my-4">
        <button class="btn btn-outline-primary" onclick="procesar('energias')">Fuentes de Energía Renovable</button>
        <button class="btn btn-outline-primary" onclick="procesar('ingles')">Presentarse en Inglés</button>
        <button class="btn btn-outline-primary" onclick="procesar('seguridad')">Seguridad Digital</button>
      </div>
      <div id="status" class="alert alert-info" style="display:none;">Generando investigación...</div>
    </div>

    <script>
      function procesar(tema) {
        document.getElementById('status').style.display = 'block';
        
        const prompts = {
          'energias': "Redacta una investigación breve sobre energías renovables, tono formal académico, nivel bachillerato, incluye introducción, desarrollo en 3 puntos, conclusión y 3 referencias APA.",
          'ingles': "Redacta una guía pedagógica sobre cómo presentarse en inglés, tono formal, nivel bachillerato, incluye saludos, frases clave, ejemplos y consejos prácticos.",
          'seguridad': "Redacta una investigación sobre hábitos de seguridad digital, tono formal, nivel bachillerato, incluye protección de identidad, contraseñas y riesgos, y referencias APA."
        };

        google.script.run
          .withSuccessHandler(function(contenido) {
            document.getElementById('status').style.display = 'none';
            const htmlContent = `<div>${contenido.replace(/\n/g, '<br>')}</div>`;
            const converted = htmlDocx.asBlob(htmlContent);
            saveAs(converted, 'Investigacion_' + tema + '.docx');
          })
          .withFailureHandler(function(err) {
            document.getElementById('status').innerText = "Error: " + err;
          })
          .generarInvestigacion(prompts[tema]);
      }
    </script>
  </body>
</html>
